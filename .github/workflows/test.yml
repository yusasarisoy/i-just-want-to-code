name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: command -v jq || brew install jq

      - name: Syntax check
        run: |
          rt=skills/i-just-want-to-code/runtime
          for f in $rt/bin/* $rt/lib/*.zsh $rt/providers/*/*.zsh $rt/install.sh tests/run.zsh; do zsh -n "$f" || exit 1; done

      - name: Tests
        run: zsh tests/run.zsh

      # No denylist in CI: leakcheck runs its built-in heuristics only.
      - name: Leak check
        run: scripts/leakcheck.sh

      - name: Validate plugin
        run: |
          if ! command -v claude >/dev/null; then
            echo "claude CLI not available; skipping plugin validate"
          elif claude plugin validate --help | grep -q -- --strict; then
            claude plugin validate --strict .
            claude plugin validate --strict --profile directory .
          else
            # Older CLIs have no --strict; validate the marketplace and plugin manifests.
            claude plugin validate .
            claude plugin validate .claude-plugin/plugin.json
          fi
